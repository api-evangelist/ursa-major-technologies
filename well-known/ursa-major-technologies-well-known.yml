findings:
- id: llms-txt-published
  detail: >-
    ursamajor.com/llms.txt returns 200 text/plain. It is auto-generated by Yoast
    SEO v25.7 and is a marketing-site index, not an API index. Saved verbatim to
    llms/ursa-major-technologies-published-llms.txt.
- id: llms-txt-broken-links
  detail: >-
    The published llms.txt emits empty link targets — every Pages and Posts entry
    is "[Title]()" with no href — so it carries titles and no URLs. Its three
    Categories links and its sitemap link point at
    ursamajor20dev.wpenginepowered.com, the WP Engine staging hostname, rather
    than at ursamajor.com. This is a provider-side generation defect: an agent
    following the file reaches a staging host or nothing at all.
