aid: ursa-major-technologies
name: Ursa Major Technologies
description: 'Ursa Major Technologies Inc. is an American aerospace and defense propulsion
  manufacturer founded in 2015 by Joe Laurienti, a former SpaceX and Blue Origin propulsion
  engineer, and headquartered at 19750 Co Rd 7 in Berthoud, Colorado, with additive
  manufacturing operations in Youngstown, Ohio. The company designs, builds and hot-fire
  tests liquid rocket engines, solid rocket motors and in-space propulsion systems for
  space launch, hypersonics and U.S. and allied defense customers. Its product line
  includes the 5,000 lbf Hadley oxygen-rich staged-combustion liquid engine — the first
  Ursa Major engine to reach flight qualification for hypersonic missions — and Draper,
  a storable, throttleable, restartable engine for tactical hypersonic strike, missile
  defense and rapid in-space maneuver, alongside a solid rocket motor line validated
  through static fire and a chemical propulsion capability for tactical satellite bus
  systems. Ursa Major was the first American company to successfully fire an oxygen-rich
  staged combustion engine; it states it has delivered more than 100 engines and logged
  over 100,000 seconds of hotfire testing, with engines and motors more than 80 percent
  3D printed by mass. The company is AS9100D, ISO 9001 and CMMC Level 2 certified. Ursa
  Major is a hardware manufacturer selling to government and prime-contractor customers:
  it publishes no public developer API, SDK, CLI, developer portal or machine-readable
  API contract of any kind.'
